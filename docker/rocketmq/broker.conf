brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH
deleteWhen = 04
fileReservedTime = 48

# Without this the broker registers its container-internal address to the namesrv, and the
# Java client running on the host resolves an unreachable IP and hangs on send.
brokerIP1 = 127.0.0.1
namesrvAddr = namesrv:9876
listenPort = 10911

# Spares us a manual `mqadmin updateTopic` for every new topic during development.
autoCreateTopicEnable = true
autoCreateSubscriptionGroup = true
